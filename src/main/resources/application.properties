server.address=${HOST:0.0.0.0}
server.port=${PORT:3000}

# One SQLite file, created on first run (see App.main for its directory). One connection: SQLite allows a single writer.
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:data/app.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# schema.sql is idempotent (CREATE TABLE IF NOT EXISTS): it runs on every boot, so there is no migration step.
spring.sql.init.mode=always
